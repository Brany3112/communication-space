<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Communication Space</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#070707;
      --stroke:rgba(255,255,255,0.08);
      --text:#f6f6f6;
      --muted:#b7b7b7;
      --muted-2:#8f8f8f;
      --accent:#b11226;
      --accent-2:#8b0000;
      --shadow:0 18px 60px rgba(0,0,0,0.42);
      --radius:24px;
      --transition:240ms cubic-bezier(.2,.8,.2,1);
      --max:1040px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}

    body{
      margin:0;
      font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(177,18,38,0.10), transparent 22%),
        radial-gradient(circle at 80% 10%, rgba(139,0,0,0.11), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(177,18,38,0.09), transparent 28%),
        linear-gradient(180deg, #090909 0%, #050505 100%);
      overflow-x:hidden;
    }

    body::before{
      content:"";
      position:fixed;
      inset:-20%;
      pointer-events:none;
      background:radial-gradient(circle, rgba(255,255,255,0.025) 0 1px, transparent 1px);
      background-size:22px 22px;
      opacity:.18;
      mask-image:linear-gradient(to bottom, rgba(0,0,0,0.8), transparent 90%);
      animation:drift 18s linear infinite;
    }

    body::after{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(3px 3px at 10% 18%, rgba(255,100,100,.18), transparent 60%),
        radial-gradient(2px 2px at 77% 22%, rgba(255,100,100,.14), transparent 60%),
        radial-gradient(2px 2px at 26% 75%, rgba(255,100,100,.12), transparent 60%),
        radial-gradient(3px 3px at 88% 80%, rgba(255,100,100,.12), transparent 60%);
      animation:floatGlow 12s ease-in-out infinite alternate;
      opacity:.75;
    }

    @keyframes drift {
      from { transform:translateY(0px); }
      to { transform:translateY(22px); }
    }

    @keyframes floatGlow {
      0% { transform:translate3d(0,0,0) scale(1); opacity:.55; }
      100% { transform:translate3d(0,-18px,0) scale(1.06); opacity:.9; }
    }

    @keyframes pageIn{
      from{opacity:0; transform:translateY(16px)}
      to{opacity:1; transform:translateY(0)}
    }

    @keyframes popIn{
      from{opacity:0; transform:translateY(18px) scale(.98)}
      to{opacity:1; transform:translateY(0) scale(1)}
    }

    .entry-screen{
      position:fixed;
      inset:0;
      z-index:100;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:
        radial-gradient(circle at 50% 20%, rgba(177,18,38,.18), transparent 32%),
        linear-gradient(180deg, rgba(7,7,7,.92), rgba(4,4,4,.97));
      transition:opacity 420ms ease, visibility 420ms ease;
    }

    .entry-screen.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .entry-card{
      width:min(100%, 560px);
      text-align:center;
      padding:34px;
      border-radius:32px;
      border:1px solid rgba(255,255,255,.08);
      background:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.03));
      box-shadow:0 24px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(177,18,38,.08);
      backdrop-filter:blur(16px);
      animation:popIn .6s cubic-bezier(.2,.8,.2,1);
    }

    .entry-card h1{
      margin:0;
      font-size:clamp(2rem, 4vw, 3rem);
      line-height:1.04;
      letter-spacing:-0.04em;
    }

    .entry-card p{
      margin:14px auto 0;
      max-width:430px;
      color:var(--muted);
      line-height:1.7;
    }

    .entry-actions{
      margin-top:28px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .entry-btn,
    .reply-toggle,
    .send-reply{
      border:none;
      border-radius:18px;
      padding:14px 16px;
      cursor:pointer;
      color:var(--text);
      font:inherit;
      font-weight:700;
      background:linear-gradient(180deg, rgba(177,18,38,.45), rgba(139,0,0,.32));
      border:1px solid rgba(177,18,38,.24);
      box-shadow:0 12px 35px rgba(177,18,38,.16), 0 0 0 1px rgba(255,255,255,.04);
      transition:transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .entry-btn:hover,
    .reply-toggle:hover,
    .send-reply:hover{
      transform:translateY(-3px) scale(1.01);
      box-shadow:0 18px 45px rgba(177,18,38,.22), 0 0 0 1px rgba(177,18,38,.18);
    }

    .shell{
      width:min(calc(100% - 32px), var(--max));
      margin:0 auto;
      padding:44px 0 64px;
      animation:pageIn .9s cubic-bezier(.2,.8,.2,1);
      transition:opacity 460ms ease, transform 460ms ease, filter 460ms ease;
    }

    body.pre-auth .shell{
      opacity:0;
      transform:scale(.985) translateY(10px);
      filter:blur(8px);
      pointer-events:none;
    }

    .hero{text-align:center;margin-bottom:28px}

    .hero h1{
      margin:0;
      font-size:clamp(2.2rem, 5vw, 3.6rem);
      line-height:1.02;
      letter-spacing:-0.04em;
      font-weight:800;
    }

    .hero p{
      margin:14px auto 0;
      max-width:640px;
      color:var(--muted);
      font-size:1rem;
      line-height:1.6;
    }

    .topbar{display:grid;gap:18px;margin-top:28px;margin-bottom:28px}

    .glass{
      background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.035));
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
      border-radius:28px;
    }

    .identity{
      padding:18px;
      display:flex;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }

    .identity-copy h2{margin:0 0 6px;font-size:1rem;letter-spacing:-0.02em}
    .identity-copy p{margin:0;color:var(--muted);font-size:.94rem}

    .segmented{
      position:relative;
      display:inline-grid;
      grid-template-columns:1fr 1fr;
      padding:6px;
      gap:6px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.05);
      border-radius:999px;
      min-width:260px;
    }

    .segmented .slider{
      position:absolute;
      top:6px;
      left:6px;
      width:calc(50% - 6px);
      height:calc(100% - 12px);
      border-radius:999px;
      background:linear-gradient(180deg, rgba(177,18,38,.32), rgba(139,0,0,.26));
      box-shadow:0 0 0 1px rgba(255,255,255,.04), 0 0 32px rgba(177,18,38,.18);
      transition:transform 380ms cubic-bezier(.2,.8,.2,1);
    }

    .segmented button{
      position:relative;
      z-index:1;
      border:none;
      background:transparent;
      color:var(--muted);
      padding:12px 18px;
      font:inherit;
      font-weight:600;
      border-radius:999px;
      cursor:pointer;
      transition:var(--transition);
    }

    .segmented button.active{
      color:var(--text);
      text-shadow:0 0 12px rgba(255,255,255,.16);
    }

    .tabs{padding:10px;position:relative;overflow:hidden}

    .tab-bar{
      position:relative;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      background:rgba(255,255,255,0.025);
      padding:8px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.05);
      margin-bottom:18px;
    }

    .tab-underline{
      position:absolute;
      top:8px;
      left:8px;
      width:calc(50% - 8px);
      height:calc(100% - 16px);
      border-radius:999px;
      background:linear-gradient(180deg, rgba(177,18,38,.38), rgba(139,0,0,.28));
      box-shadow:0 0 0 1px rgba(177,18,38,.22), 0 0 35px rgba(177,18,38,.2);
      transition:transform 420ms cubic-bezier(.2,.8,.2,1);
    }

    .tab-btn{
      position:relative;
      z-index:1;
      appearance:none;
      border:none;
      background:transparent;
      color:var(--muted);
      font:inherit;
      font-weight:700;
      padding:14px 18px;
      border-radius:999px;
      cursor:pointer;
      transition:var(--transition);
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
    }

    .tab-btn.active,.tab-btn:hover{color:var(--text)}

    .tab-badge{
      min-width:26px;
      padding:3px 8px;
      border-radius:999px;
      background:rgba(177,18,38,.18);
      border:1px solid rgba(177,18,38,.28);
      color:#ffd6dc;
      font-size:.78rem;
      line-height:1.1;
      opacity:0;
      transform:scale(.92);
      transition:opacity var(--transition), transform var(--transition);
    }

    .tab-badge.show{opacity:1;transform:scale(1)}

    .status-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:4px 10px 12px;
      color:var(--muted);
      font-size:.92rem;
    }

    .presence{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .dot{
      width:10px;
      height:10px;
      border-radius:50%;
      background:var(--accent);
      box-shadow:0 0 14px rgba(177,18,38,.7);
      animation:pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse{
      0%,100%{transform:scale(1);opacity:.75}
      50%{transform:scale(1.2);opacity:1}
    }

    .viewport{overflow:hidden;position:relative;border-radius:24px}
    .track{
      display:flex;
      width:200%;
      transition:transform 420ms cubic-bezier(.2,.8,.2,1);
      will-change:transform;
    }

    .panel{width:50%;padding:4px 4px 8px}
    .cards{display:grid;gap:22px}

    .card{
      position:relative;
      padding:24px;
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.035));
      border:1px solid rgba(255,255,255,.08);
      box-shadow:var(--shadow);
      overflow:hidden;
      transition:transform 260ms cubic-bezier(.2,.8,.2,1), box-shadow 260ms ease, border-color 260ms ease;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:auto -20% -40% auto;
      width:180px;
      height:180px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(177,18,38,.14), transparent 70%);
      pointer-events:none;
      filter:blur(10px);
    }

    .card:hover{
      transform:translateY(-5px);
      border-color:rgba(177,18,38,.22);
      box-shadow:0 22px 70px rgba(0,0,0,.48), 0 0 0 1px rgba(177,18,38,.14);
    }

    .card-head{
      display:flex;
      align-items:start;
      justify-content:space-between;
      gap:14px;
      margin-bottom:16px;
    }

    .card h3{margin:0 0 8px;font-size:1.06rem;letter-spacing:-0.02em}
    .card p{margin:0;color:var(--muted);line-height:1.55;font-size:.95rem;max-width:60ch}

    .chip{
      white-space:nowrap;
      align-self:flex-start;
      font-size:.8rem;
      color:#ffd9de;
      background:rgba(177,18,38,.14);
      border:1px solid rgba(177,18,38,.18);
      border-radius:999px;
      padding:8px 12px;
    }

    .write-area,.thread-input{
      width:100%;
      min-height:160px;
      resize:vertical;
      border:none;
      outline:none;
      padding:18px 18px 20px;
      border-radius:20px;
      background:linear-gradient(180deg, rgba(0,0,0,.42), rgba(255,255,255,.02));
      color:var(--text);
      font:inherit;
      line-height:1.65;
      border:1px solid rgba(255,255,255,.06);
      box-shadow:inset 0 0 0 1px rgba(255,255,255,.015);
      transition:border-color var(--transition), box-shadow var(--transition), transform var(--transition), background var(--transition);
    }

    .thread-input{min-height:96px}
    .write-area::placeholder,.thread-input::placeholder{color:#898989}

    .write-area:focus,.thread-input:focus{
      border-color:rgba(177,18,38,.38);
      box-shadow:inset 0 0 0 1px rgba(177,18,38,.18),0 0 0 1px rgba(177,18,38,.16),0 0 26px rgba(177,18,38,.18);
      transform:translateY(-1px);
      background:linear-gradient(180deg, rgba(0,0,0,.45), rgba(177,18,38,.035));
    }

    .write-area[readonly]{cursor:not-allowed;opacity:.82}

    .card-foot{
      margin-top:14px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
    }

    .meta{color:var(--muted-2);font-size:.86rem;min-height:1.2em}

    .notify{
      opacity:0;
      transform:translateY(6px);
      transition:opacity 220ms ease, transform 220ms ease;
      color:#ffe1e5;
      background:rgba(177,18,38,.16);
      border:1px solid rgba(177,18,38,.18);
      border-radius:999px;
      padding:8px 12px;
      font-size:.84rem;
    }

    .notify.show{opacity:1;transform:translateY(0)}
    .card-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

    .thread-wrap{
      margin-top:16px;
      display:grid;
      gap:14px;
      opacity:0;
      max-height:0;
      overflow:hidden;
      transform:translateY(6px);
      transition:max-height 320ms ease, opacity 260ms ease, transform 260ms ease;
    }

    .thread-wrap.open{
      opacity:1;
      max-height:1400px;
      transform:translateY(0);
    }

    .thread-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      color:var(--muted);
      font-size:.88rem;
      padding:0 4px;
    }

    .thread-list{display:grid;gap:10px}
    .reply-item{
      padding:14px 16px;
      border-radius:18px;
      background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.025));
      border:1px solid rgba(255,255,255,.06);
    }

    .reply-author{
      font-weight:700;
      font-size:.9rem;
      margin-bottom:6px;
      color:#ffdce2;
    }

    .reply-text{
      color:var(--text);
      line-height:1.65;
      white-space:pre-wrap;
      word-break:break-word;
    }

    .reply-time{
      margin-top:8px;
      color:var(--muted-2);
      font-size:.78rem;
    }

    .thread-compose{display:grid;gap:10px}

    .thread-empty{
      padding:14px 16px;
      border-radius:18px;
      color:var(--muted);
      border:1px dashed rgba(177,18,38,.18);
      background:rgba(177,18,38,.04);
    }

    .footer-note{
      margin-top:18px;
      padding:16px 18px;
      border:1px dashed rgba(177,18,38,.22);
      border-radius:20px;
      color:var(--muted);
      line-height:1.6;
      background:rgba(177,18,38,.05);
    }

    .tiny{font-size:.85rem;color:var(--muted-2)}

    @media (max-width:760px){
      .shell{width:min(calc(100% - 20px), var(--max));padding-top:24px}
      .identity{padding:16px}
      .segmented{width:100%;min-width:unset}
      .status-row{padding-left:4px;padding-right:4px;flex-direction:column;align-items:flex-start}
      .card{padding:18px}
      .card-head{flex-direction:column}
      .hero p{font-size:.95rem}
      .write-area{min-height:150px}
      .entry-actions{grid-template-columns:1fr}
      .card-foot{align-items:flex-start}
    }
  </style>
</head>
<body class="pre-auth">
  <div class="entry-screen" id="entryScreen">
    <div class="entry-card">
      <h1>Who are you?</h1>
      <p></p>
      <div class="entry-actions">
        <button class="entry-btn" data-entry-profile="brany">Brany</button>
        <button class="entry-btn" data-entry-profile="denisia">Denisia</button>
      </div>
    </div>
  </div>

  <main class="shell">
    <header class="hero">
      <h1>Communication Space</h1>
      <p>A place to say things that are sometimes hard to say.</p>
    </header>

    <section class="topbar">
      <div class="identity glass">
        <div class="identity-copy">
          <h2>Your writing profile</h2>
          <p>Choose who you are. You can view both tabs, but each profile edits only its own space to avoid sync conflicts.</p>
        </div>

        <div class="segmented" id="profileSwitch" aria-label="Choose profile">
          <div class="slider" id="profileSlider"></div>
          <button type="button" data-profile="brany" class="profile-btn active">Brany</button>
          <button type="button" data-profile="denisia" class="profile-btn">Denisia</button>
        </div>
      </div>

      <div class="tabs glass">
        <div class="tab-bar" aria-label="Communication tabs">
          <div class="tab-underline" id="tabUnderline"></div>
          <button type="button" class="tab-btn active" data-tab="brany"><span>Brany</span><span class="tab-badge" id="badge-brany">+0</span></button>
          <button type="button" class="tab-btn" data-tab="denisia"><span>Denisia</span><span class="tab-badge" id="badge-denisia">+0</span></button>
        </div>

        <div class="status-row">
          <div class="presence"><span class="dot"></span><span id="liveStatus">Connecting...</span></div>
          <div class="tiny" id="modeLabel">Mode: loading</div>
        </div>

        <div class="viewport">
          <div class="track" id="track">
            <section class="panel" data-panel="brany"></section>
            <section class="panel" data-panel="denisia"></section>
          </div>
        </div>

        <div class="footer-note" id="privacyNote" hidden></div>
      </div>
    </section>
  </main>

  <script type="module">
    const firebaseConfig = {
      apiKey: "AIzaSyArVcexyr2lGCSxDIS9YQDJVPuyBpffG70",
      authDomain: "communication-space-70b30.firebaseapp.com",
      projectId: "communication-space-70b30",
      storageBucket: "communication-space-70b30.firebasestorage.app",
      messagingSenderId: "660878503081",
      appId: "1:660878503081:web:131bb49b988a6bf792cdb8",
      measurementId: "G-N7GSKPPFTD"
    };

    const BOARD_ID = "communication-space-main";
    const PROFILES = ["brany", "denisia"];
    const SECTIONS = [
      { key: "appreciate", title: "What I appreciate about you", description: "Things you admire, like or value about the other person.", placeholder: "Write something you appreciate..." },
      { key: "bothered", title: "Things that bothered me", description: "Small things that might have hurt or annoyed you.", placeholder: "Write what bothered you..." },
      { key: "differently", title: "Things I wish we did differently", description: "Things you think could be improved between you two.", placeholder: "Write your thoughts..." },
      { key: "unsaid", title: "What I feel but didn't say", description: "Thoughts or feelings you kept inside.", placeholder: "Write what you feel..." }
    ];

    const state = {
      currentTab:"brany",
      profile:null,
      isFirebaseReady:false,
      db:null,
      unsubscribers:[],
      editors:new Map(),
      threads:new Map(),
      entryDocs:new Map(),
      draftTimers:new Map()
    };

    const entryScreen = document.getElementById("entryScreen");
    const panelTrack = document.getElementById("track");
    const tabUnderline = document.getElementById("tabUnderline");
    const profileSlider = document.getElementById("profileSlider");
    const modeLabel = document.getElementById("modeLabel");
    const liveStatus = document.getElementById("liveStatus");
    const badgeEls = { brany: document.getElementById("badge-brany"), denisia: document.getElementById("badge-denisia") };
    const panelMap = { brany: document.querySelector('[data-panel="brany"]'), denisia: document.querySelector('[data-panel="denisia"]') };

    function formatTime(date){
      if(!date) return "Not saved yet";
      const d = date instanceof Date ? date : new Date(date);
      if(Number.isNaN(d.getTime())) return "Not saved yet";
      return new Intl.DateTimeFormat([], { hour:"2-digit", minute:"2-digit", month:"short", day:"numeric" }).format(d);
    }

    function getDisplayName(profile){ return profile === "brany" ? "Brany" : "Denisia"; }
    function storageKey(profile, section){ return `${profile}:${section}`; }

    function escapeHtml(str){
      return String(str)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#39;");
    }

    function setLiveStatus(text){ liveStatus.textContent = text; }

    function showToast(editorKey, text="Saved."){
      const editor = state.editors.get(editorKey);
      if(!editor) return;
      editor.notify.textContent = text;
      editor.notify.classList.add("show");
      clearTimeout(editor.toastTimer);
      editor.toastTimer = setTimeout(()=>editor.notify.classList.remove("show"), 1400);
    }

    function applyReadOnlyStates(){
      for(const [,editor] of state.editors){
        const canEdit = editor.profile === state.profile;
        editor.textarea.readOnly = !canEdit;
        editor.chip.textContent = canEdit ? "Editable by you" : `Viewing ${getDisplayName(editor.profile)}`;
      }
    }

    function getViewedActivityMap(){
      try{
        return JSON.parse(localStorage.getItem("commspace-viewed-activity") || "{}");
      }catch{
        return {};
      }
    }

    function setViewedActivityMap(map){
      localStorage.setItem("commspace-viewed-activity", JSON.stringify(map));
    }

    function getTabActivity(profile){
      let total = 0;
      for(const section of SECTIONS){
        const data = state.entryDocs.get(storageKey(profile, section.key)) || {};
        total += Number(data.activityCount || 0);
      }
      return total;
    }

    function markTabViewed(profile){
      const map = getViewedActivityMap();
      map[profile] = getTabActivity(profile);
      setViewedActivityMap(map);
      updateTabBadges();
    }

    function updateTabBadges(){
      const map = getViewedActivityMap();
      for(const profile of PROFILES){
        const current = getTabActivity(profile);
        const viewed = Number(map[profile] || 0);
        const diff = Math.max(0, current - viewed);
        const badge = badgeEls[profile];
        if(diff > 0 && profile !== state.currentTab){
          badge.textContent = `+${diff}`;
          badge.classList.add("show");
        } else {
          badge.classList.remove("show");
        }
      }
    }

    function setTab(tab){
      state.currentTab = tab;
      panelTrack.style.transform = tab === "brany" ? "translateX(0%)" : "translateX(-50%)";
      tabUnderline.style.transform = tab === "brany" ? "translateX(0%)" : "translateX(100%)";
      document.querySelectorAll(".tab-btn").forEach(btn=>btn.classList.toggle("active", btn.dataset.tab === tab));
      applyReadOnlyStates();
      markTabViewed(tab);
      updateTabBadges();
    }

    function setProfile(profile){
      state.profile = profile;
      state.currentTab = profile;
      profileSlider.style.transform = profile === "brany" ? "translateX(0%)" : "translateX(100%)";
      document.querySelectorAll(".profile-btn").forEach(btn=>btn.classList.toggle("active", btn.dataset.profile === profile));
      setTab(profile);
    }

    function enterApp(profile){
      setProfile(profile);
      document.body.classList.remove("pre-auth");
      entryScreen.classList.add("hidden");
      setTimeout(()=>{ if(entryScreen.parentNode) entryScreen.remove(); }, 500);
    }

    function renderPanels(){
      for(const profile of PROFILES){
        panelMap[profile].innerHTML = `<div class="cards">${SECTIONS.map(section => `
          <article class="card">
            <div class="card-head">
              <div><h3>${section.title}</h3><p>${section.description}</p></div>
              <span class="chip" id="chip-${profile}-${section.key}"></span>
            </div>

            <textarea class="write-area" id="input-${profile}-${section.key}" data-profile="${profile}" data-section="${section.key}" placeholder="${section.placeholder}" spellcheck="true"></textarea>

            <div class="card-foot">
              <div class="meta" id="meta-${profile}-${section.key}">Not saved yet</div>
              <div class="card-actions">
                <button class="reply-toggle" type="button" data-thread-toggle="${profile}:${section.key}">Reply</button>
                <div class="notify" id="notify-${profile}-${section.key}">Saved.</div>
              </div>
            </div>

            <div class="thread-wrap" id="thread-${profile}-${section.key}">
              <div class="thread-head"><span>Thread</span><span id="thread-meta-${profile}-${section.key}">No replies yet</span></div>
              <div class="thread-list" id="thread-list-${profile}-${section.key}"><div class="thread-empty">No replies yet. Use this to react to what is written above.</div></div>
              <div class="thread-compose">
                <textarea class="thread-input" id="thread-input-${profile}-${section.key}" placeholder="Write a reply..." spellcheck="true"></textarea>
                <div class="card-actions"><button class="send-reply" type="button" data-thread-send="${profile}:${section.key}">Send reply</button></div>
              </div>
            </div>
          </article>
        `).join("")}</div>`;
      }

      for(const profile of PROFILES){
        for(const section of SECTIONS){
          const key = storageKey(profile, section.key);
          const textarea = document.getElementById(`input-${profile}-${section.key}`);
          const meta = document.getElementById(`meta-${profile}-${section.key}`);
          const notify = document.getElementById(`notify-${profile}-${section.key}`);
          const chip = document.getElementById(`chip-${profile}-${section.key}`);
          const threadWrap = document.getElementById(`thread-${profile}-${section.key}`);
          const threadList = document.getElementById(`thread-list-${profile}-${section.key}`);
          const threadMeta = document.getElementById(`thread-meta-${profile}-${section.key}`);
          const threadInput = document.getElementById(`thread-input-${profile}-${section.key}`);

          state.editors.set(key, { key, profile, section: section.key, textarea, meta, notify, chip, toastTimer:null });
          state.threads.set(key, { key, wrap: threadWrap, list: threadList, meta: threadMeta, input: threadInput });

          textarea.addEventListener("input", ()=>handleInput(profile, section.key));
          textarea.addEventListener("blur", ()=>{ if(textarea.dataset.pending === "true") flushWrite(profile, section.key); });
        }
      }

      document.querySelectorAll("[data-thread-toggle]").forEach(btn => {
        btn.addEventListener("click", ()=>{
          const key = btn.dataset.threadToggle;
          const thread = state.threads.get(key);
          const isOpen = thread.wrap.classList.toggle("open");
          btn.textContent = isOpen ? "Hide replies" : "Reply";
        });
      });

      document.querySelectorAll("[data-thread-send]").forEach(btn => {
        btn.addEventListener("click", async ()=>{
          const [profile, section] = btn.dataset.threadSend.split(":");
          await sendReply(profile, section);
        });
      });

      applyReadOnlyStates();
    }

    async function initFirebase(){
      try{
        const appMod = await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js");
        const firestoreMod = await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js");
        const app = appMod.initializeApp(firebaseConfig);
        const db = firestoreMod.getFirestore(app);
        state.db = db;
        state.isFirebaseReady = true;
        modeLabel.textContent = "";
        setLiveStatus("Connected live");
        subscribeFirestore(firestoreMod);
      } catch (error) {
        console.error(error);
        modeLabel.textContent = "Mode: connection failed";
        setLiveStatus("Firebase failed");
      }
    }

    async function subscribeFirestore(firestoreMod){
      const { doc, collection, query, orderBy, onSnapshot } = firestoreMod;

      for(const profile of PROFILES){
        for(const section of SECTIONS){
          const key = storageKey(profile, section.key);
          const entryRef = doc(state.db, "boards", BOARD_ID, "entries", key);

          const unsubEntry = onSnapshot(entryRef, (snap) => {
            const editor = state.editors.get(key);
            if(!editor) return;
            const data = snap.exists() ? snap.data() : {};
            state.entryDocs.set(key, data);
            const remoteText = data.text || "";
            const updatedAt = data.updatedAt?.toDate ? data.updatedAt.toDate() : null;
            const shouldApplyText = document.activeElement !== editor.textarea || editor.profile !== state.profile;
            if(shouldApplyText && editor.textarea.value !== remoteText) editor.textarea.value = remoteText;
            const changedBy = data.lastEditedBy ? getDisplayName(data.lastEditedBy) : "unknown";
            editor.meta.textContent = updatedAt
              ? `Last updated ${formatTime(updatedAt)} by ${changedBy} `
              : "Waiting for first message...";
            updateTabBadges();
            showToast(key, "Synced.");
          });
          state.unsubscribers.push(unsubEntry);

          const messagesRef = query(collection(state.db, "boards", BOARD_ID, "entries", key, "messages"), orderBy("createdAt", "asc"));
          const unsubMessages = onSnapshot(messagesRef, (snapshot) => {
            const thread = state.threads.get(key);
            if(!thread) return;
            const messages = snapshot.docs.map(docSnap => ({ id: docSnap.id, ...docSnap.data() }));
            renderThreadMessages(key, messages);
            updateTabBadges();
          });
          state.unsubscribers.push(unsubMessages);
        }
      }
    }

    function renderThreadMessages(key, messages){
      const thread = state.threads.get(key);
      if(!thread) return;
      if(!messages.length){
        thread.list.innerHTML = `<div class="thread-empty">No replies yet. Use this to react to what is written above.</div>`;
        thread.meta.textContent = "No replies yet";
        return;
      }
      const last = messages[messages.length - 1];
      thread.meta.textContent = `Last reply ${last.createdAt?.toDate ? formatTime(last.createdAt.toDate()) : "just now"} by ${getDisplayName(last.author || "brany")}`;
      thread.list.innerHTML = messages.map(message => `
        <div class="reply-item">
          <div class="reply-author">${getDisplayName(message.author || "brany")}:</div>
          <div class="reply-text">${escapeHtml(message.text || "")}</div>
          <div class="reply-time">${message.createdAt?.toDate ? formatTime(message.createdAt.toDate()) : "Sending..."}</div>
        </div>
      `).join("");
    }

    function handleInput(profile, section){
      const key = storageKey(profile, section);
      const editor = state.editors.get(key);
      if(!editor) return;
      editor.textarea.dataset.pending = "true";
      clearTimeout(state.draftTimers.get(key));
      const timer = setTimeout(() => flushWrite(profile, section), 140);
      state.draftTimers.set(key, timer);
      editor.meta.textContent = "Syncing...";
    }

    async function flushWrite(profile, section){
      const key = storageKey(profile, section);
      const editor = state.editors.get(key);
      if(!editor || !state.isFirebaseReady || !state.db || !state.profile) return;

      const newText = editor.textarea.value;
      const currentData = state.entryDocs.get(key) || {};
      const previousText = currentData.text || "";

      if(newText === previousText){
        editor.textarea.dataset.pending = "false";
        return;
      }

      editor.textarea.dataset.pending = "false";

      try{
        const firestoreMod = await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js");
        const { doc, collection, writeBatch, serverTimestamp, increment } = firestoreMod;

        const batch = writeBatch(state.db);
        const entryRef = doc(state.db, "boards", BOARD_ID, "entries", key);
        const historyRef = doc(collection(state.db, "boards", BOARD_ID, "entries", key, "history"));

        batch.set(historyRef, {
          changedBy: state.profile,
          changedAt: serverTimestamp(),
          previousText,
          newText,
          changeType: previousText ? "edit" : "create"
        });

        batch.set(entryRef, {
          text: newText,
          updatedAt: serverTimestamp(),
          lastEditedBy: state.profile,
          profile,
          section,
          revisionCount: increment(1),
          activityCount: increment(1)
        }, { merge: true });

        await batch.commit();
        editor.meta.textContent = "Synced live";
      } catch (error) {
        console.error("Write failed:", error);
        editor.meta.textContent = "Sync failed";
        showToast(key, "Retry needed");
      }
    }

    async function sendReply(profile, section){
      const key = storageKey(profile, section);
      const thread = state.threads.get(key);
      if(!thread || !state.isFirebaseReady || !state.db || !state.profile) return;

      const text = thread.input.value.trim();
      if(!text) return;

      try{
        const firestoreMod = await import("https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js");
        const { collection, doc, writeBatch, serverTimestamp, increment } = firestoreMod;

        const batch = writeBatch(state.db);
        const messageRef = doc(collection(state.db, "boards", BOARD_ID, "entries", key, "messages"));
        const entryRef = doc(state.db, "boards", BOARD_ID, "entries", key);

        batch.set(messageRef, {
          text,
          author: state.profile,
          createdAt: serverTimestamp()
        });

        batch.set(entryRef, {
          profile,
          section,
          threadLastActivityAt: serverTimestamp(),
          threadLastActivityBy: state.profile,
          activityCount: increment(1)
        }, { merge: true });

        await batch.commit();
        thread.input.value = "";
        thread.wrap.classList.add("open");
        showToast(key, "Reply sent");
      } catch (error) {
        console.error("Reply failed:", error);
        showToast(key, "Reply failed");
      }
    }

    function wireSwitches(){
      document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => setTab(btn.dataset.tab)));
      document.querySelectorAll(".profile-btn").forEach(btn => btn.addEventListener("click", () => setProfile(btn.dataset.profile)));
      document.querySelectorAll("[data-entry-profile]").forEach(btn => btn.addEventListener("click", () => enterApp(btn.dataset.entryProfile)));
    }

    renderPanels();
    wireSwitches();
    initFirebase();
  </script>
</body>
</html>
